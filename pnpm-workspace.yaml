packages:
  - .
  - apps/*
  - packages/*

allowBuilds:
  '@reown/appkit': set this to true or false
  bufferutil: set this to true or false
  es5-ext: set this to true or false
  esbuild: set this to true or false
  keccak: set this to true or false
  protobufjs: set this to true or false
  secp256k1: set this to true or false
  sharp: set this to true or false
  tiny-secp256k1: set this to true or false
  unrs-resolver: set this to true or false
  utf-8-validate: set this to true or false

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - bufferutil
  - esbuild
  - keccak
  - sharp
  - unrs-resolver
  - utf-8-validate
