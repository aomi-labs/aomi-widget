<svg width="1120" height="700" viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Assertion and verification taxonomy">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;}
.h{font-size:14px;font-weight:700}
.s{font-size:11.5px;fill:#6b7280}
.b{font-size:12px;fill:#1f2937}
.chip{font-size:11.5px;fill:#1f2937;text-anchor:middle}
.arw{stroke:#6b7280;stroke-width:1.4;fill:none}
.cap{font-size:12px;fill:#6b7280}
</style>
</defs>
<text x="40" y="32" font-size="18" font-weight="700" fill="#1f2937">Assertion &amp; verification taxonomy</text>
<text x="40" y="54" class="s">Deterministic, assertion-based — checked against the recorded trajectory + chain state</text>

<!-- three evidence kinds -->
<rect x="40" y="74" width="330" height="120" rx="9" fill="#eef5fc" stroke="#378ADD" stroke-width="1.3"/>
<text x="58" y="100" class="h" fill="#185FA5">① Deterministic simulation</text>
<text x="58" y="120" class="s">before authorization · read-only</text>
<text x="58" y="146" class="b">predicted Δ · decoded traces</text>
<text x="58" y="166" class="b">gas · expected events</text>

<rect x="395" y="74" width="330" height="120" rx="9" fill="#f6fcf9" stroke="#1D9E75" stroke-width="1.3"/>
<text x="413" y="100" class="h" fill="#0F6E56">② Pinned-fork replay</text>
<text x="413" y="120" class="s">after the action · end-state equivalence</text>
<text x="413" y="146" class="b">balances · positions · approvals</text>
<text x="413" y="166" class="b">emitted logs</text>

<rect x="750" y="74" width="330" height="120" rx="9" fill="#fffaf0" stroke="#EF9F27" stroke-width="1.3"/>
<text x="768" y="100" class="h" fill="#B0710F">③ Wallet / callback evidence</text>
<text x="768" y="120" class="s">it was actually submitted</text>
<text x="768" y="146" class="b">authorization round-trip</text>
<text x="768" y="166" class="b">wallet:tx_complete signal</text>

<path class="arw" d="M205,194 V232" marker-end="url(#a)"/>
<path class="arw" d="M560,194 V232" marker-end="url(#a)"/>
<path class="arw" d="M915,194 V232" marker-end="url(#a)"/>

<!-- assertion menu -->
<rect x="40" y="236" width="1040" height="190" rx="9" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
<text x="58" y="262" class="h" fill="#374151">ASSERTION MENU — what a spec can require</text>
<g>
<rect x="62" y="280" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="182" y="305">expected tools &amp; order</text>
<rect x="318" y="280" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="438" y="305">tool args (to · value · sig)</text>
<rect x="574" y="280" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="694" y="305">absence of tool errors</text>
<rect x="830" y="280" width="232" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="946" y="305">pending-tx / EIP-712 counts</text>
<rect x="62" y="330" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="182" y="355">observed callbacks</text>
<rect x="318" y="330" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="438" y="355">observed wallet events</text>
<rect x="574" y="330" width="240" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="694" y="355">balance Δ / exact / lower-bound</text>
<rect x="830" y="330" width="232" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text class="chip" x="946" y="355">event-log matches</text>
</g>
<text x="58" y="404" class="s">Each assertion is one externally observable fact — together they say exactly what "done correctly and safely" means.</text>

<path class="arw" d="M300,426 L300,460" marker-end="url(#a)"/>
<path class="arw" d="M800,426 L800,460" marker-end="url(#a)"/>

<!-- required vs warning -->
<rect x="40" y="464" width="500" height="86" rx="9" fill="#fff7ed" stroke="#EF9F27" stroke-width="1.4"/>
<text x="58" y="490" class="h" fill="#B0710F">REQUIRED</text>
<text x="58" y="512" class="b">determine pass / fail — the run is credited</text>
<text x="58" y="532" class="b">only if every required assertion holds</text>

<rect x="560" y="464" width="520" height="86" rx="9" fill="#fafafa" stroke="#9CA3AF" stroke-width="1.3"/>
<text x="578" y="490" class="h" fill="#4b5563">WARNING</text>
<text x="578" y="512" class="b">budgets · hints — diagnostic signal</text>
<text x="578" y="532" class="b">without failing the run</text>

<!-- two principles -->
<text x="40" y="592" class="h" fill="#374151">Two principles underneath:</text>
<text x="40" y="616" class="b">• Execution correctness ≠ economic correctness — assert the objective (route, amount, resulting state), not just that a tx landed.</text>
<text x="40" y="640" class="b">• Safety is part of correctness — review-first / read-only tasks assert the absence of unsafe side effects.</text>
</svg>