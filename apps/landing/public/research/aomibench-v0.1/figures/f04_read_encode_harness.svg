<path class="arwR" d="M340,132 V152" marker-end="url(#ar)"/>
<path class="arwW" d="M980,132 V152" marker-end="url(#aw)"/>
<text class="hdR" x="340" y="172">READ path</text>
<text class="hdW" x="980" y="172">WRITE path</text>
<rect class="boxR" x="70" y="186" width="540" height="196" rx="8"/>
<text class="fnR" x="92" y="212">get_contract(addr, chain)</text>
<text class="dim" x="108" y="236">· DB cache hit  → return</text>
<text class="dim" x="108" y="258">· miss → Etherscan fetch</text>
<text class="dim" x="108" y="280">· store back + proxy-resolve (EIP-1967)</text>
<text class="fnR" x="92" y="308">get_account_info(addr, chain)</text>
<text class="dim" x="108" y="330">→ {balance, nonce}   (gateway)</text>
<text class="fnR" x="92" y="358">encode_and_call(sig, args, to)</text>
<path class="arwR" d="M340,388 V412" marker-end="url(#ar)"/>
<text class="fnRm" x="340" y="436">eth_call(chain, to, calldata)</text>
<text class="dimm" x="340" y="458">(Anvil fork / gateway)</text>
<path class="arwR" d="M340,472 V496" marker-end="url(#ar)"/>
<text class="txm" x="340" y="520">raw 32-byte result</text>
<path class="arwR" d="M340,534 V558" marker-end="url(#ar)"/>
<text class="fnRm" x="340" y="582">format_token_units(raw, dec)</text>
<text class="fnRm" x="340" y="604">format_wei_as_eth(wei)</text>
<path class="arwR" d="M340,618 V642" marker-end="url(#ar)"/>
<rect class="pillR" x="150" y="650" width="380" height="30" rx="15"/>
<text class="txm" x="340" y="670">human-readable JSON → model</text>
<rect class="boxW" x="700" y="186" width="560" height="72" rx="8"/>
<text class="fnW" x="722" y="214">stage_tx { to, sig, args[] }</text>
<text class="dim" x="738" y="238">args = base units   (from model)</text>
<path class="arwW" d="M980,264 V288" marker-end="url(#aw)"/>
<rect class="boxW" x="700" y="294" width="560" height="116" rx="8"/>
<text class="fnW" x="722" y="320">abi_encoder::execute_call</text>
<text class="dim" x="738" y="346">parse_function_signature → selector = keccak256[:4]</text>
<text class="dim" x="738" y="370">parse_param_value  (str → DynSolValue)</text>
<text class="dim" x="738" y="394">abi_encode_params → 32-byte words</text>
<path class="arwW" d="M980,416 V440" marker-end="url(#aw)"/>
<text class="txm" x="980" y="464">calldata = 0x&lt;selector&gt;&lt;words&gt;</text>
<path class="arwW" d="M980,478 V502" marker-end="url(#aw)"/>
<text class="fnWm" x="980" y="526">AssembledEvmTx{ from*, chain*, to, value, data, label, kind }</text>
<text class="dimm" x="980" y="548">(*from / chain injected from wallet ctx)</text>
<path class="arwW" d="M980,562 V586" marker-end="url(#aw)"/>
<rect class="pillW" x="790" y="594" width="380" height="30" rx="15"/>
<text class="txm" x="980" y="614">user_state.pending_txs → commit_txs → sign</text>
<rect class="own" x="70" y="700" width="1190" height="100" rx="10"/>
<text x="92" y="728" font-size="14" font-weight="700" fill="#B0710F">OWNERSHIP — why the model never sees a byte</text>
<text class="ow" x="92" y="758">HARNESS owns</text>
<text class="ov" x="252" y="758">selector · ABI words · eth_call · result decoding · output unit-format</text>
<text class="ow" x="92" y="786">MODEL owns</text>
<text class="ov" x="252" y="786">addresses · signatures · base-unit amounts</text>
