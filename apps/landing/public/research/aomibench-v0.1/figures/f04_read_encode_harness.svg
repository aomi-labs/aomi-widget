<text class="ttl" x="40" y="34">The read / encode harness</text>
<text class="sub" x="40" y="56">what's under "the model never sees a byte"</text>
<rect x="620" y="26" width="13" height="13" rx="3" fill="#1D9E75"/>
<text class="lg" x="640" y="37">READ path</text>
<rect x="760" y="26" width="13" height="13" rx="3" fill="#7F77DD"/>
<text class="lg" x="780" y="37">WRITE path</text>
<rect x="908" y="26" width="13" height="13" rx="3" fill="#EF9F27"/>
<text class="lg" x="928" y="37">ownership boundary</text>
<text class="model" x="660" y="102">MODEL · high-level intent only</text>
<path class="arwN" d="M660,114 V132"/>
