<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aomi — architecture &amp; pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    /* cool neutral ramp (zinc) */
    --cool-0:#ffffff; --cool-50:#fafafa; --cool-100:#f4f4f5; --cool-200:#e4e4e7;
    --cool-300:#d4d4d8; --cool-400:#a1a1aa; --cool-500:#71717a; --cool-600:#52525b;
    --cool-700:#3f3f46; --cool-800:#27272a; --cool-900:#18181b; --cool-950:#09090b;
    /* sky — primary accent */
    --sky:#5288c2; --info:#416cac; --sky-50:#f2f7fc; --sky-100:#e2eef8; --sky-200:#cfe1f3; --sky-300:#aecbe8; --sky-line:#7facd6;
    /* decorative (used sparingly) */
    --lilac-100:#efe9f1; --lilac-200:#e3d8e6; --lilac-500:#9c83a8;
    --pink:#df5d90; --pink-text:#c8527f; --pink-50:#fbe4ef; --pink-200:#f6cbdd;
    /* somm co-brand (reference deployment only) */
    --somm:#e5544a; --somm-tint:#fdeae8; --somm-line:#f3b4ae; --somm-navy:#22212e; --somm-navy2:#2b2a38;
    /* status */
    --success:#2e9e6b; --success-subtle:#e4f3ec; --success-line:#a8d8c0;
    --warning:#d9982b;
    /* roles */
    --ink:var(--cool-950); --muted:var(--cool-500); --subtle:var(--cool-400);
    --bg:var(--cool-0); --bg-subtle:var(--cool-50); --panel:var(--cool-100);
    --border:var(--cool-200); --border-strong:var(--cool-300);
    /* type */
    --display:"PT Serif",ui-serif,Georgia,Cambria,serif;
    --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --word:"Source Serif 4",ui-serif,Georgia,Cambria,serif;
    --poppins:"Poppins",var(--sans);
    --sh-sm:0 1px 2px rgba(13,13,15,.04);
    --sh-md:0 4px 16px rgba(13,13,15,.06);
    --sh-lg:0 12px 40px rgba(13,13,15,.10);
    --ease:cubic-bezier(.2,0,0,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.55;
    font-feature-settings:"cv01","ss01";
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 48px}
  section{padding:84px 0;border-top:1px solid var(--border)}
  @media(max-width:720px){.wrap{padding:0 24px}section{padding:56px 0}}

  .secno{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:baseline;gap:14px;margin:0 0 26px}
  .secno b{color:var(--info);font-weight:500}
  h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.02em}
  h1{font-size:50px;line-height:1.1}
  h2{font-size:35px;line-height:1.14}
  h3{font-size:18px;letter-spacing:-.01em}
  @media(max-width:720px){h1{font-size:34px}h2{font-size:27px}}
  p{margin:0}
  .lead{color:var(--cool-600);font-size:18px;max-width:68ch;line-height:1.65}
  .mono{font-family:var(--mono)}
  .hl{color:var(--ink);font-weight:600}
  .hl-sky{color:var(--info);font-weight:600}

  /* logo lockup */
  .lock{display:inline-flex;align-items:center;gap:11px}
  .lock .mark{width:24px;height:24px;color:var(--ink)}
  .lock .word{font-family:var(--word);font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
  .lock .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:4px;padding-top:3px;border-left:1px solid var(--border-strong);padding-left:11px}

  /* ---------- HERO ---------- */
  .hero{padding:56px 0 72px}
  .hero .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}
  .hero .h-eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--info);margin-bottom:22px}
  .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:52px;align-items:center}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:36px}}
  .hero h1{font-size:38px}
  @media(max-width:720px){.hero h1{font-size:30px}}
  .hero .lead{margin-top:24px;font-size:17.5px;max-width:58ch}
  .hero-demo .dl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);margin-bottom:10px;text-align:right}
  .aud{display:flex;flex-wrap:wrap;gap:9px;margin-top:36px}
  .aud .tag2{font-family:var(--mono);font-size:11.5px;color:var(--cool-600);background:var(--bg);border:1px solid var(--border);
    border-radius:999px;padding:6px 13px}

  /* ---------- SECTION 01 · situation / result ---------- */
  .pains{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border)}
  @media(max-width:860px){.pains{grid-template-columns:1fr}}
  .pain{padding:26px 28px 30px;border-right:1px solid var(--border)}
  .pain:last-child{border-right:0}
  @media(max-width:860px){.pain{border-right:0;border-bottom:1px solid var(--border)}}
  .pain .pn{font-family:var(--mono);font-size:11px;color:var(--subtle);letter-spacing:.1em}
  .pain p{margin-top:13px;font-size:15px;color:var(--cool-700);line-height:1.6}
  .pain p b{color:var(--ink);font-weight:600}

  .results{margin-top:64px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
  @media(max-width:860px){.stats{grid-template-columns:1fr 1fr}}
  .stat{padding:26px 26px 30px 0;border-right:1px solid var(--border);margin-right:26px}
  .stat:last-child{border-right:0;margin-right:0}
  @media(max-width:860px){.stat:nth-child(2){border-right:0}}
  .stat .v{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
  .stat .v .u{font-size:19px;color:var(--info)}
  .stat .l{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-top:12px;line-height:1.6}

  .fieldq{margin-top:64px;border-left:3px solid var(--sky);background:var(--sky-50);padding:20px 26px;max-width:78ch}
  .fieldq p{font-family:var(--display);font-style:italic;font-size:17.5px;line-height:1.55;color:var(--cool-700)}
  .fieldq .src{margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  .thesis{margin-top:64px;padding-top:40px;border-top:1px solid var(--border);text-align:center}
  .thesis .t{font-family:var(--display);font-weight:700;font-size:29px;letter-spacing:-.015em;color:var(--ink)}
  .thesis .t .a{color:var(--info)}
  .thesis .s{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}

  /* ---------- SECTION 02 · integration ---------- */
  .cs-sec{background:var(--bg-subtle)}
  .cs-tag{display:inline-flex;gap:9px;align-items:center;background:var(--bg);border:1px solid var(--border);
    color:var(--cool-700);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;margin-bottom:20px}
  .cs-tag .g{width:6px;height:6px;border-radius:50%;background:var(--success)}
  .sao{display:grid;grid-template-columns:130px 1fr;gap:18px;margin-top:34px;max-width:80ch}
  @media(max-width:720px){.sao{grid-template-columns:1fr;gap:6px}}
  .sao .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--info);padding-top:3px}
  .sao .v{font-size:15px;color:var(--cool-700);line-height:1.6}
  .sao .v b{color:var(--ink);font-weight:600}

  .cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
  @media(max-width:900px){.cs-grid{grid-template-columns:1fr}}
  .cs-panel{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:16px;
    padding:18px 20px 96px;box-shadow:var(--sh-sm);min-height:300px;display:flex;flex-direction:column}
  .cs-step{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--subtle);margin-bottom:16px}
  .cs-step b{color:var(--info);font-weight:500}
  .cs-step b.sm{color:var(--somm)}
  .cs-cap{position:absolute;left:20px;right:20px;bottom:16px;font-size:13.5px;color:var(--cool-600);border-top:1px solid var(--border);padding-top:10px}
  .cs-cap b{color:var(--ink);font-weight:600}

  /* somm 3×3 dot mark (reference deployment) */
  .smk{position:relative;overflow:hidden;border-radius:13%;flex:none}
  .smk i{position:absolute;width:50%;height:50%;border-radius:50%;background:var(--somm);transform:translate(-50%,-50%)}

  /* panel 1 · signer stays */
  .sg-box{flex:1;background:linear-gradient(180deg,rgba(82,136,194,.10),rgba(82,136,194,.02));
    border:1px solid var(--sky-200);border-radius:12px;padding:14px;display:flex;flex-direction:column}
  .sg-box .hd{display:flex;align-items:center;justify-content:space-between}
  .sg-box .hd .l{font-weight:600;font-size:12.5px}
  .sg-box .keys{font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--info);
    border:1px solid var(--sky-200);border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.7)}
  .sg-box .keys b{color:var(--success);font-weight:700}
  .sg-chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 4px;justify-content:center}
  .sg-chips span{font-family:var(--mono);font-size:10px;color:var(--ink);border:1px solid var(--border-strong);
    border-radius:999px;padding:5px 11px;background:var(--bg)}
  .sg-chips span.own{border-color:var(--info);color:var(--info);box-shadow:0 0 0 3px var(--sky-100)}
  .sg-rail{margin-top:auto;border-top:1px dashed var(--sky-200);padding-top:9px;
    font-family:var(--mono);font-size:8.5px;color:var(--info);text-align:center;letter-spacing:.04em}

  /* panel 2 · intent → tx */
  .p2{flex:1;display:flex;flex-direction:column;gap:9px}
  .p2u{align-self:flex-end;max-width:92%;background:var(--panel);border-radius:10px 10px 3px 10px;
    padding:8px 12px;font-size:12.5px;line-height:1.45;color:var(--ink)}
  .p2x{border:1px solid var(--sky-300);background:var(--sky-50);border-radius:9px;padding:9px 11px;
    font-family:var(--mono);font-size:10px;line-height:1.8;color:var(--cool-700)}
  .p2x .bt{color:var(--info);font-weight:700}
  .p2x .a{color:var(--info)}
  .p2x .ok{color:var(--success)}
  .p2n{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:center;letter-spacing:.04em}

  /* panel 3 · policy */
  .p3{flex:1;display:flex;flex-direction:column;gap:10px}
  .p3c{background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:11px 13px;
    font-family:var(--mono);font-size:10.5px;line-height:2;color:var(--cool-700)}
  .p3c .k2{color:var(--info)}
  .p3c .v2{color:var(--ink)}
  .p3c .cm{color:var(--subtle)}
  .p3f{display:flex;flex-wrap:wrap;gap:6px}
  .k{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--border);color:var(--cool-600);background:var(--bg-subtle)}
  .k.win{background:var(--success-subtle);color:#217a51;border-color:var(--success-line)}

  /* row 2 · surfaces + live widget */
  .cs-demo{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;margin-top:16px}
  @media(max-width:900px){.cs-demo{grid-template-columns:1fr}}
  .cs-surf{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-sm)}
  .cs-surf .chips{display:flex;flex-direction:column;gap:10px;margin-top:16px;align-items:flex-start}
  .cs-surf .chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink);
    background:var(--bg);border:1px solid var(--border-strong);border-radius:999px;padding:7px 14px;box-shadow:var(--sh-sm)}
  .cs-surf .chip .d{width:7px;height:7px;border-radius:50%;background:var(--sky)}
  .cs-surf .chip.on{border:1.4px solid var(--info);color:var(--info);box-shadow:0 0 0 3px var(--sky-100)}
  .cs-surf .chip.more{border-style:dashed;color:var(--subtle)}
  .cs-surf .note2{margin-top:16px;font-size:13px;color:var(--muted);line-height:1.55}
  .cs-surf .note2 b{color:var(--ink)}

  /* live widget (white-label wallet concept) */
  .wcard{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--sh-lg)}
  .wbar{height:34px;background:#17171b;display:flex;align-items:center;gap:8px;padding:0 12px}
  .aw-logo{width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,#7facd6,#df5d90);flex:none}
  .awn{font-size:11.5px;font-weight:600;color:#e7e6ec}
  .wbar .addr{font-family:var(--mono);font-size:9.5px;color:#8f8d9c;background:#26262c;border-radius:999px;padding:2px 8px}
  .wbar .u{font-family:var(--mono);font-size:10.5px;color:#b7b3c2;margin-left:auto;letter-spacing:.02em}
  .wtabs{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--panel)}
  .wtabs span{font-size:11px;font-weight:500;color:var(--muted);padding:4px 12px;border-radius:999px}
  .wtabs .on{color:#fff;background:var(--ink);font-weight:600}
  .wbody{padding:14px 16px 15px;display:flex;flex-direction:column;gap:8px}
  .wch{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding-bottom:9px;border-bottom:1px solid var(--panel)}
  .wch b{color:var(--ink);font-weight:700}
  .wch svg{width:10px;height:10px}
  .wmsg{opacity:0;transform:translateY(7px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
  .wmsg.on{opacity:1;transform:none}
  .wu{align-self:flex-end;max-width:88%;background:var(--panel);border-radius:10px 10px 3px 10px;
    padding:9px 12px;font-size:13px;line-height:1.45;color:var(--ink)}
  .wtr{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
    color:var(--cool-700);border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--bg-subtle)}
  .wtr .sp{width:10px;height:10px;border:1.6px solid var(--border-strong);border-top-color:var(--info);border-radius:50%;animation:wspin .8s linear infinite;flex:none}
  .wtr .ck{display:none;color:var(--success);font-style:normal;font-size:11px;flex:none}
  .wtr.done .sp{display:none}
  .wtr.done .ck{display:inline}
  .wtr .rs{color:var(--subtle);margin-left:auto;white-space:nowrap}
  @keyframes wspin{to{transform:rotate(360deg)}}
  .wbx{border:1px solid var(--sky-300);background:var(--sky-50);border-radius:9px;padding:9px 11px;
    font-family:var(--mono);font-size:10.5px;line-height:1.75;color:var(--cool-700)}
  .wbx .bt{color:var(--info);font-weight:700;display:flex;align-items:center;gap:6px}
  .wbx .bt .sp{width:10px;height:10px;border:1.6px solid var(--sky-200);border-top-color:var(--info);border-radius:50%;animation:wspin .8s linear infinite;flex:none}
  .wbx.done .bt .sp{display:none}
  .wbx .br{opacity:0;transform:translateX(-5px);transition:all .4s var(--ease)}
  .wbx .br.on{opacity:1;transform:none}
  .wbx .br .a{color:var(--info)}
  .wbx .bf{color:var(--success);opacity:0;transition:opacity .4s}
  .wbx .bf.on{opacity:1}
  .wrow{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .wsign{font-size:12.5px;font-weight:600;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;
    transition:transform .25s var(--ease),background .35s var(--ease),color .35s var(--ease)}
  .wsign.press{transform:scale(.93)}
  .wsign.signed{background:var(--success-subtle);color:var(--success)}
  .wrun{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .wrun i{font-style:normal;color:var(--info)}

  /* the embed · code block */
  .code{background:#18181b;border:1px solid #27272a;border-radius:12px;overflow:hidden;box-shadow:var(--sh-lg)}
  .code .ch2{height:30px;background:#101013;display:flex;align-items:center;gap:6px;padding:0 12px}
  .code .ch2 .dot{width:7px;height:7px;border-radius:50%;background:#3f3f46}
  .code .ch2 .fn{font-family:var(--mono);font-size:10.5px;color:#a1a1aa;margin-left:auto;letter-spacing:.02em}
  .code pre{margin:0;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.75;color:#d4d4d8;overflow-x:auto}
  .code pre .kw{color:#7facd6}
  .code pre .st{color:#8fd0ae}
  .code pre .cm{color:#71717a}
  .code pre .tg{color:#e8b3cb}
  .code-notes{margin-top:12px;font-family:var(--mono);font-size:10.5px;line-height:2;color:var(--cool-600)}
  .code-notes .a{color:var(--info)}
  .code-notes b{color:var(--ink);font-weight:500}

  /* production-proof strip (no co-brand) */
  .prod-strip{margin-top:22px;border:1px solid var(--border);border-radius:14px;background:var(--bg);
    padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .prod-strip .g{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-subtle);flex:none}
  .prod-strip p{font-size:13.5px;color:var(--cool-600);line-height:1.6}
  .prod-strip p b{color:var(--ink);font-weight:600}
  .prod-strip .x{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--subtle);white-space:nowrap}

  /* reference-deployment band */
  .somm-band{margin-top:22px;background:radial-gradient(58% 120% at 50% 30%,var(--somm-navy2),var(--somm-navy) 75%);
    border-radius:18px;padding:32px 38px;display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap}
  .somm-band .lk{display:flex;align-items:center;gap:16px}
  .somm-band .lk .smk{width:32px;height:32px}
  .somm-band .lk .sw{font-family:var(--poppins);font-weight:600;font-size:27px;color:#f4f3f6;letter-spacing:-.01em}
  .somm-band .lk .div{width:1.5px;height:32px;background:rgba(255,255,255,.18)}
  .somm-band .lk .am{width:25px;height:25px;color:#f4f3f6}
  .somm-band .lk .aw{font-family:var(--word);font-weight:600;font-size:25px;color:#f4f3f6}
  .somm-band .msg{color:#f4f3f6;font-weight:600;font-size:15.5px;line-height:1.35}
  .somm-band .msg .pb{display:block;font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.22em;
    text-transform:uppercase;color:#8f8d9c;margin-top:9px}
  .somm-band .msg .pb b{color:#cfcdd8;font-weight:500}
  .somm-band .facts{display:flex;flex-direction:column;gap:7px}
  .somm-band .facts span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#cfcdd8;
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .somm-band .facts span i{font-style:normal;color:var(--somm)}

  /* ---------- SECTION 03 · capabilities ---------- */
  .cap-block{margin-top:52px}
  .cap-block .ch{display:flex;align-items:baseline;gap:14px;border-top:2px solid var(--ink);padding-top:18px;margin-bottom:22px}
  .cap-block .ch .n{font-family:var(--mono);font-size:11.5px;color:var(--info);letter-spacing:.08em}
  .cap-block .ch h3{font-size:21px}

<script>
(function(){
  /* scale the 1280-wide architecture figure to whatever column width it lands in */
  var wrap = document.getElementById('archwrap');
  var stage = document.getElementById('archstage');
  if (wrap && stage) {
    // the deck stage is 1280 wide but its content stops at ~1105 — crop the dead column
    var STAGE_W = 1116, STAGE_H = 420;
    var tries = 0;
    var fit = function(){
      var w = wrap.clientWidth || (wrap.parentElement && wrap.parentElement.clientWidth) || 0;
      // a zero measurement means layout isn't ready yet — retry instead of collapsing the figure
      if (!w) { if (tries++ < 600) requestAnimationFrame(fit); return; }
      tries = 0;
      var s = w / STAGE_W;
      stage.style.transform = 'scale(' + s + ')';
      wrap.style.height = Math.round(STAGE_H * s) + 'px';
    };
    // keep a reference — an unreferenced ResizeObserver can be collected
    var ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
    if (ro) ro.observe(wrap.parentElement || wrap);
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    requestAnimationFrame(fit);
    fit();
  }
})();
</script>
