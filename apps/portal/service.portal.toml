# The AOMI service topology — the portal's committed view of the mesh.
#
# One node per service: its identity (`name`/`kid`), SPKI `public_key` (the
# private half lives in that service's env, never here), the `issues` roles it
# may mint, and the `audiences` it may sign for. The portal selects its own node
# (`aomi-bff`) and mints `service.portal.toml`-authorized bearers with
# PORTAL_SERVICE_PRIVATE_KEY (env). Public keys here MUST match the
# backend's `service.toml` (verifier view) — same mesh, two vantages
# (docs/topics/account-authentication/facts/service-identity.md).
#
# Add a partner platform = add a `[[services]]` node here (and in the backend's
# service.toml). They hold their own private key and mint `service` bearers.

[[services]]
name = "aomi-bff"           # the portal BFF — mints user + service bearers
kid = "aomi-bff-dev-1"
issues = ["user", "service"]
audiences = ["aomi-backend"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAXx7J0PUDLOHG4dz5gIB0tpHdezW6TyV8N98cwunGyKw=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-admin"         # human ops tooling — mints admin bearers
kid = "aomi-admin-dev-1"
issues = ["admin"]
audiences = ["aomi-backend"]
public_key = """
-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEA+rVh5FCH+iZOESNOhlQYzrFT2yjzllT9kzSZeq1Dg/w=
-----END PUBLIC KEY-----
"""

[[services]]
name = "aomi-backend"       # the consumer — verifies only, mints nothing
kid = "aomi-backend"
issues = []
audiences = []
public_key = ""
